[package]
name = "canvas"
version = "0.1.0"
edition = "2024"

[dependencies]
# 2D only. Bevy's defaults also pull in 3d, ui, and audio — PBR, glTF, and
# rodio are dead weight for a drawing canvas.
bevy = { version = "0.19.0", default-features = false, features = [
    "2d",
    # Debug readout only. `default_font` embeds a fallback face so the HUD
    # needs no asset files; drop both when the readout goes away.
    "bevy_text",
    "default_font",
] }
magic-core = { version = "0.1.0", path = "../../crates/magic-core" }

[features]
dev = ["bevy/dynamic_linking"]
